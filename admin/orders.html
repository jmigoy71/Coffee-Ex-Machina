
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management | Coffee Ex Machina</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .orders-page {
            min-height: 100vh;
            padding: 35px;
            background: #17110e;
            color: #f5e9d5;
        }

        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .orders-header h1 {
            color: #f5e9d5;
            margin-top: 8px;
        }

        .back-dashboard {
            color: #d6b77a;
            text-decoration: none;
        }

        .orders-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .order-stat {
            padding: 22px;
            background: #241b16;
            border: 1px solid rgba(214,183,122,.3);
            border-radius: 11px;
        }

        .order-stat p {
            color: #b9a993;
            margin-bottom: 10px;
        }

        .order-stat h2 {
            color: #d6b77a;
            font-size: 30px;
        }

        .orders-section {
            padding: 25px;
            background: #241b16;
            border: 1px solid rgba(214,183,122,.3);
            border-radius: 12px;
        }

        .orders-section h2 {
            color: #d6b77a;
            margin-bottom: 18px;
        }

        .orders-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .orders-toolbar select {
            padding: 11px 15px;
            background: #17110e;
            color: #f5e9d5;
            border: 1px solid rgba(214,183,122,.4);
            border-radius: 7px;
        }

        .order-list {
            display: grid;
            gap: 20px;
        }

        .order-card {
            padding: 22px;
            background: #17110e;
            border: 1px solid rgba(214,183,122,.3);
            border-radius: 10px;
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(214,183,122,.2);
        }

        .order-card-header h3 {
            color: #d6b77a;
        }

        .order-date {
            color: #b9a993;
            font-size: 12px;
            margin-top: 5px;
        }

        .order-status {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-received {
            background: #49391f;
            color: #f3d18a;
        }

        .status-confirmed,
        .status-preparing {
            background: #263e50;
            color: #a9d5f0;
        }

        .status-ready {
            background: #24462f;
            color: #a9e2b8;
        }

        .status-out {
            background: #3e3153;
            color: #d5b9ff;
        }

        .status-delivered {
            background: #24462f;
            color: #a9e2b8;
        }

        .status-cancelled {
            background: #512c27;
            color: #f2aaa0;
        }

        .order-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            padding: 20px 0;
        }

        .order-detail-group h4 {
            color: #d6b77a;
            margin-bottom: 9px;
        }

        .order-detail-group p {
            color: #c5b8a5;
            font-size: 14px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .order-items {
            padding: 15px 0;
            border-top: 1px solid rgba(214,183,122,.2);
        }

        .order-items h4 {
            color: #d6b77a;
            margin-bottom: 12px;
        }

        .order-item-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            color: #c5b8a5;
            font-size: 14px;
            margin: 9px 0;
        }

        .order-item-row strong {
            color: #f5e9d5;
            white-space: nowrap;
        }

        .order-total {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(214,183,122,.2);
        }

        .order-total strong {
            color: #d6b77a;
            font-size: 21px;
        }

        .order-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .order-actions button {
            padding: 11px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .process-order {
            background: #d6b77a;
            color: #1a120d;
            border: none;
        }

        .process-order:hover {
            background: #f5e9d5;
        }

        .cancel-order {
            background: transparent;
            color: #e29585;
            border: 1px solid #9b5146;
        }

        .cancel-order:hover {
            background: #512c27;
        }

        .ready-message {
            color: #a9e2b8;
            font-size: 13px;
        }

        .empty-orders {
            padding: 45px 15px;
            text-align: center;
            color: #b9a993;
        }

        .orders-refresh {
            padding: 11px 16px;
            background: transparent;
            color: #d6b77a;
            border: 1px solid #d6b77a;
            border-radius: 7px;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .orders-page {
                padding: 18px;
            }

            .orders-stats {
                grid-template-columns: 1fr;
            }

            .order-details {
                grid-template-columns: 1fr;
            }

            .orders-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<main class="orders-page">

    <!-- HEADER -->
    <header class="orders-header">

        <div>
            <p style="color:#d6b77a;">
                COFFEE EX MACHINA / STAFF PORTAL
            </p>

            <h1>Order Management</h1>

            <p style="color:#b9a993;">
                Review and process customer orders.
            </p>
        </div>

        <a href="dashboard.html" class="back-dashboard">
            ← Back to Dashboard
        </a>

    </header>


    <!-- ORDER STATISTICS -->
    <section class="orders-stats">

        <div class="order-stat">
            <p>New Orders</p>
            <h2 id="newOrdersCount">0</h2>
        </div>

        <div class="order-stat">
            <p>In Progress</p>
            <h2 id="preparingCount">0</h2>
        </div>

        <div class="order-stat">
            <p>Completed Orders</p>
            <h2 id="completedCount">0</h2>
        </div>

    </section>


    <!-- CUSTOMER ORDERS -->
    <section class="orders-section">

        <div class="orders-toolbar">

            <h2>Customer Orders</h2>

            <div>
                <select id="orderFilter">
                    <option value="all">All Orders</option>
                    <option value="Order Received">New Orders</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Preparing">Preparing</option>
                    <option value="Ready for Pickup">Ready for Pickup</option>
                    <option value="Out for Delivery">Out for Delivery</option>
                    <option value="Delivered">Delivered</option>
                    <option value="Cancelled">Cancelled</option>
                </select>

                <button type="button"
                        class="orders-refresh"
                        id="refreshOrders">
                    ↻ Refresh
                </button>
            </div>

        </div>

        <div id="orderList" class="order-list">

            <div class="empty-orders">
                No customer orders yet.
            </div>

        </div>

    </section>

</main>


<script>

// =================================
// 1. LOAD CUSTOMER ORDERS
// =================================

function loadOrders() {

    try {

        const savedOrders = localStorage.getItem("cemOrders");

        const orders = savedOrders
            ? JSON.parse(savedOrders)
            : [];

        return Array.isArray(orders) ? orders : [];

    } catch (error) {

        console.error("Unable to load orders:", error);
        return [];

    }

}


// =================================
// 2. FORMAT PRICE AND DATE
// =================================

function formatPrice(amount) {

    return "₱" + Number(amount || 0).toLocaleString("en-PH", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    });

}

function formatDate(dateString) {

    if (!dateString) return "Date unavailable";

    const date = new Date(dateString);

    if (Number.isNaN(date.getTime())) {
        return "Date unavailable";
    }

    return date.toLocaleString("en-PH", {
        dateStyle: "medium",
        timeStyle: "short"
    });

}


// =================================
// 3. STATUS CLASS
// =================================

function getStatusClass(status) {

    const statusClasses = {
        "Order Received": "status-received",
        "Confirmed": "status-confirmed",
        "Preparing": "status-preparing",
        "Ready for Pickup": "status-ready",
        "Out for Delivery": "status-out",
        "Delivered": "status-delivered",
        "Cancelled": "status-cancelled"
    };

    return statusClasses[status] || "status-received";

}


// =================================
// 4. UPDATE DASHBOARD COUNTS
// =================================

function updateStatistics(orders) {

    const newOrders = orders.filter(
        order => !order.status || order.status === "Order Received"
    ).length;

    const inProgress = orders.filter(
        order => ["Confirmed", "Preparing", "Ready for Pickup"]
            .includes(order.status)
    ).length;

    const completed = orders.filter(
        order => order.status === "Delivered"
    ).length;

    document.getElementById("newOrdersCount").textContent = newOrders;

    document.getElementById("preparingCount").textContent = inProgress;

    document.getElementById("completedCount").textContent = completed;

}


// =================================
// 5. CREATE ORDER DETAILS
// =================================

function createTextElement(tag, className, value) {

    const element = document.createElement(tag);

    if (className) {
        element.className = className;
    }

    element.textContent = value;

    return element;

}


// =================================
// 6. DISPLAY CUSTOMER ORDERS
// =================================

function renderOrders() {

    const orders = loadOrders();

    const orderList = document.getElementById("orderList");

    const filter = document.getElementById("orderFilter").value;

    updateStatistics(orders);

    orderList.replaceChildren();

    let filteredOrders = orders;

    if (filter !== "all") {

        filteredOrders = orders.filter(
            order => (order.status || "Order Received") === filter
        );

    }

    // Sort newest orders first
    filteredOrders.sort(function(a, b) {
        return new Date(b.createdAt || 0) -
               new Date(a.createdAt || 0);
    });

    if (filteredOrders.length === 0) {

        const emptyMessage = createTextElement(
            "p",
            "empty-orders",
            filter === "all"
                ? "No customer orders yet."
                : "No orders found for this status."
        );

        orderList.appendChild(emptyMessage);

        return;
    }


    filteredOrders.forEach(function(order) {

        const card = document.createElement("article");

        card.className = "order-card";

        const currentStatus = order.status || "Order Received";


        // ORDER HEADER
        const header = document.createElement("div");

        header.className = "order-card-header";

        const headingGroup = document.createElement("div");

        const reference = createTextElement(
            "h3",
            "",
            order.reference || "Order Reference Unavailable"
        );

        const date = createTextElement(
            "p",
            "order-date",
            formatDate(order.createdAt)
        );

        headingGroup.append(reference, date);

        const status = createTextElement(
            "span",
            "order-status " + getStatusClass(currentStatus),
            currentStatus
        );

        header.append(headingGroup, status);


        // CUSTOMER INFORMATION
        const details = document.createElement("div");

        details.className = "order-details";

        const customerGroup = document.createElement("div");

        customerGroup.className = "order-detail-group";

        customerGroup.append(
            createTextElement("h4", "", "Customer Information"),
            createTextElement("p", "", order.customerName || "Not provided"),
            createTextElement("p", "", order.customerPhone || "No phone number")
        );

        const deliveryGroup = document.createElement("div");

        deliveryGroup.className = "order-detail-group";

        deliveryGroup.append(
            createTextElement("h4", "", "Delivery Information"),
            createTextElement("p", "", order.deliveryAddress || "No address provided"),
            createTextElement(
                "p",
                "",
                "Instructions: " + (order.deliveryInstructions || "None")
            )
        );

        details.append(customerGroup, deliveryGroup);


        // PAYMENT METHOD
        const payment = createTextElement(
            "p",
            "",
            "Payment Method: " + (order.paymentMethod || "Not specified")
        );

        payment.style.color = "#d6b77a";
        payment.style.fontSize = "13px";
        payment.style.marginBottom = "12px";


        // ORDER ITEMS
        const itemsSection = document.createElement("div");

        itemsSection.className = "order-items";

        itemsSection.appendChild(
            createTextElement("h4", "", "Ordered Products")
        );

        (Array.isArray(order.items) ? order.items : [])
            .forEach(function(item) {

                const row = document.createElement("div");

                row.className = "order-item-row";

                const productName = createTextElement(
                    "span",
                    "",
                    item.name + " × " + item.quantity
                );

                const itemTotal = createTextElement(
                    "strong",
                    "",
                    formatPrice(item.price * item.quantity)
                );

                row.append(productName, itemTotal);

                itemsSection.appendChild(row);

            });


        // ORDER TOTAL
        const total = document.createElement("div");

        total.className = "order-total";

        total.append(
            createTextElement("span", "", "Order Subtotal"),
            createTextElement("strong", "", formatPrice(order.subtotal))
        );


        // ORDER ACTIONS
        const actions = document.createElement("div");

        actions.className = "order-actions";

        let nextStatus = null;
        let actionLabel = "";

        if (currentStatus === "Order Received") {
            nextStatus = "Confirmed";
            actionLabel = "Confirm Order";
        } else if (currentStatus === "Confirmed") {
            nextStatus = "Preparing";
            actionLabel = "Start Preparing";
        } else if (currentStatus === "Preparing") {
            nextStatus = "Ready for Pickup";
            actionLabel = "Mark Ready for Pickup";
        }

        if (nextStatus) {

            const processButton = document.createElement("button");

            processButton.type = "button";
            processButton.className = "process-order";
            processButton.textContent = actionLabel;

            processButton.addEventListener("click", function() {
                updateOrderStatus(order.reference, nextStatus);
            });

            actions.appendChild(processButton);

        } else if (currentStatus === "Ready for Pickup") {

            actions.appendChild(
                createTextElement(
                    "p",
                    "ready-message",
                    "Order is ready and waiting for rider assignment."
                )
            );

        }


        // CANCEL BUTTON
        if (["Order Received", "Confirmed", "Preparing"].includes(currentStatus)) {

            const cancelButton = document.createElement("button");

            cancelButton.type = "button";
            cancelButton.className = "cancel-order";
            cancelButton.textContent = "Cancel Order";

            cancelButton.addEventListener("click", function() {
                cancelOrder(order.reference);
            });

            actions.appendChild(cancelButton);

        }


        // ASSEMBLE CARD
        card.append(
            header,
            details,
            payment,
            itemsSection,
            total,
            actions
        );

        orderList.appendChild(card);

    });

}


// =================================
// 7. UPDATE ORDER STATUS
// =================================

function updateOrderStatus(reference, newStatus) {

    const orders = loadOrders();

    const order = orders.find(function(item) {
        return item.reference === reference;
    });

    if (!order) {
        alert("Order could not be found.");
        return;
    }

    order.status = newStatus;

    localStorage.setItem(
        "cemOrders",
        JSON.stringify(orders)
    );

    // Keep the latest-order copy in sync
    const latestOrder = localStorage.getItem("cemLatestOrder");

    if (latestOrder) {

        try {

            const latest = JSON.parse(latestOrder);

            if (latest.reference === reference) {

                latest.status = newStatus;

                localStorage.setItem(
                    "cemLatestOrder",
                    JSON.stringify(latest)
                );

            }

        } catch (error) {
            console.error("Unable to update latest order:", error);
        }

    }

    renderOrders();

}


// =================================
// 8. CANCEL ORDER
// =================================

function cancelOrder(reference) {

    const confirmed = confirm(
        "Are you sure you want to cancel this customer order?"
    );

    if (!confirmed) return;

    updateOrderStatus(reference, "Cancelled");

}


// =================================
// 9. EVENT LISTENERS
// =================================

document.getElementById("orderFilter")
    .addEventListener("change", renderOrders);

document.getElementById("refreshOrders")
    .addEventListener("click", renderOrders);


// INITIAL DISPLAY
renderOrders();

</script>

</body>
</html>
